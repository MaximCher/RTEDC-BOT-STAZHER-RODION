services:
  db:
    image: ankane/pgvector:latest
    container_name: srvt_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB-srvt_bot}
      POSTGRES_USER: ${POSTGRES_USER-srvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-ChangeThisToSecurePassword123!}
    ports:
      - "5433:5432"
    volumes:
      - srvt_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER-srvt} -d ${POSTGRES_DB-srvt_bot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srvt_bot
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    command: python -m src.main
    restart: unless-stopped

volumes:
  srvt_postgres_data:

