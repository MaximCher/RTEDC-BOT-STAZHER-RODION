services:
  db:
    image: ankane/pgvector:latest
    container_name: srvt_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB-srvt_bot}
      POSTGRES_USER: ${POSTGRES_USER-srvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-ChangeThisToSecurePassword123!}
    volumes:
      - srvt_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER-srvt} -d ${POSTGRES_DB-srvt_bot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srvt_bot
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: python -m src.main
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srvt_web
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    command: python -m src.web_server
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: srvt_nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  srvt_postgres_data:


